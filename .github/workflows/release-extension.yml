name: Release extension

on:
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          npm ci --prefix ../web
          npm ci

      - name: Test
        run: xvfb-run -a npm test

      - name: Package
        run: npx vsce package --no-dependencies

      - name: GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#vscode-v}"
          gh release create "$GITHUB_REF_NAME" vscode/*.vsix \
            --title "GDS Inspector for VS Code $VERSION" \
            --notes "Install in VS Code, Cursor, Windsurf or VSCodium: Extensions view, ... menu, Install from VSIX, then pick the attached file."

      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --packagePath *.vsix --pat "$VSCE_PAT"

      - name: Publish to Open VSX (Cursor, Windsurf, VSCodium)
        if: env.OVSX_PAT != ''
        run: npx ovsx publish *.vsix --pat "$OVSX_PAT"
